[project]
name = "astro-imaging-agent"
dynamic = ["version"]
description = "Deterministic astronomical FITS processing with reproducible pipelines and provider-independent planning"
authors = [{name = "Ondřej Brůha", email = "ondrej.bruha@alphacodes.eu"}]
maintainers = [{name = "Ondřej Brůha", email = "ondrej.bruha@alphacodes.eu"}]
readme = "README.md"
requires-python = ">=3.12,<4.0"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["astronomy", "fits", "image-processing", "cli", "pipelines"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.19,<1.0",
    "pydantic>=2.10,<3.0",
    "numpy>=2.0,<3.0",
    "scipy>=1.14,<2.0",
    "astropy>=7.0,<9.0",
    "photutils>=2.2,<4.0",
    "PyYAML>=6.0.2,<7.0",
    "Pillow>=11.0,<13.0",
    "tifffile>=2025.1,<2027.0",
    "pypng>=0.20220715.0,<1.0",
]

[project.scripts]
aia = "astroagent.cli.main:app"

[project.optional-dependencies]
openai = ["openai>=1.90,<3.0"]
anthropic = ["anthropic>=0.60,<1.0"]
gemini = ["google-genai>=1.30,<3.0"]
llm = ["openai>=1.90,<3.0", "anthropic>=0.60,<1.0", "google-genai>=1.30,<3.0"]

[tool.poetry]
requires-poetry = ">=2.2,<3.0"
packages = [{include = "astroagent", from = "src"}]
include = [
    {path = "tests", format = "sdist"},
    {path = "examples", format = "sdist"},
    {path = "development.md", format = "sdist"},
    {path = "AGENTS.md", format = "sdist"},
    {path = "scripts", format = "sdist"},
    {path = "docs", format = "sdist"},
]
version = "0.0.0"

[tool.poetry.requires-plugins]
poetry-dynamic-versioning = {version = ">=1.9,<2.0", extras = ["plugin"]}

[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
style = "pep440"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<10.0"
pytest-cov = ">=6.0,<8.0"
ruff = ">=0.12,<1.0"
mypy = ">=1.15,<2.0"
types-PyYAML = ">=6.0,<7.0"
twine = ">=6.0,<7.0"

[build-system]
requires = ["poetry-core>=2.2,<3.0", "poetry-dynamic-versioning>=1.9,<2.0"]
build-backend = "poetry_dynamic_versioning.backend"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
source = ["astroagent"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]
ignore = ["D100", "D104", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"src/astroagent/cli/**" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/astroagent"]

[[tool.mypy.overrides]]
module = ["astropy.*", "photutils.*", "scipy.*", "png"]
ignore_missing_imports = true
