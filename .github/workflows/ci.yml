name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry and its versioning plugin
        # Avoid project-local plugin installation across C: and D: on Windows runners.
        run: python -m pip install poetry==2.3.1 "poetry-dynamic-versioning[plugin]==1.10.0"
      - run: poetry install --no-interaction --all-extras
      - run: poetry check --lock
      - run: poetry run ruff format --check .
      - run: poetry run ruff check .
      - run: poetry run mypy
      - run: poetry run pytest --cov=astroagent --cov-report=term-missing
      - run: poetry build
      - run: poetry run python scripts/check_dist.py
      - name: Installed wheel CLI and worker processing, interruption, and restart smoke
        run: poetry run python scripts/smoke_dist.py
