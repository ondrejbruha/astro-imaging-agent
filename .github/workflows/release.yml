name: release
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Require a release tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "::error::Run release.yml on a vX.Y.Z Git tag."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry and its versioning plugin
        # Keep the tooling environment consistent with CI, including Windows runners.
        run: python -m pip install poetry==2.3.1 "poetry-dynamic-versioning[plugin]==1.10.0"
      - run: poetry install --no-interaction --all-extras
      - run: poetry check --lock
      - run: poetry run ruff format --check .
      - run: poetry run ruff check .
      - run: poetry run mypy
      - run: poetry run pytest --cov=astroagent --cov-report=term-missing
      - run: poetry build
      - run: poetry run python scripts/check_dist.py
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - run: poetry run python scripts/smoke_dist.py
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
